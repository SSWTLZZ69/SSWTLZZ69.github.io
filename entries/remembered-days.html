<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记得的日子 · 记忆画布</title>
<meta name="description" content="把记得的日子摆成一张格子：有颜色的那一天，格子里就是那天的颜色；只留了一句话的那一天，格子是浅的。">
<link rel="stylesheet" href="../assets/canvas.css">
<style>
  .month-block {
    padding-top: 2.9rem;
    animation: settle 900ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }

  .month-block:first-child {
    padding-top: 0.9rem;
  }

  .month-title {
    margin: 0 0 1.2rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--paper-deep);
    color: var(--quiet);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.3em;
  }

  .month {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.7rem 0.4rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .weekday {
    padding-bottom: 0.2rem;
    color: var(--quiet);
    font-size: 0.6875rem;
    letter-spacing: 0.12em;
    text-align: center;
  }

  .day {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    min-width: 0;
  }

  .day .num {
    color: var(--quiet);
    font-size: 0.625rem;
    letter-spacing: 0.04em;
    text-align: center;
  }

  .day.marked .num { color: var(--ink); }

  .slot {
    display: flex;
    height: 1.1rem;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 1px 0 rgb(255 255 255 / 0.5) inset,
                0 1px 3px rgb(23 23 26 / 0.08);
  }

  .slot span { flex: 1 1 0; }

  .day.faint .slot {
    background: var(--paper-deep);
    box-shadow: none;
  }

  .day.empty .slot {
    height: 1.1rem;
    border: 1px solid #e4e1d8;
    background: transparent;
    box-shadow: none;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.4rem;
    margin: 2.4rem 0 0;
    padding: 0;
    list-style: none;
    color: var(--quiet);
    font-size: 0.75rem;
    letter-spacing: 0.04em;
  }

  .legend[hidden] { display: none; }

  .legend li {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .legend .swatch {
    width: 0.85rem;
    height: 0.85rem;
    border-radius: 4px;
  }

  .legend .swatch.many {
    background: linear-gradient(90deg,
      #e56b6f 0 20%, #e9b949 20% 40%, #70b88b 40% 60%,
      #6d9ed6 60% 80%, #9a7bc2 80% 100%);
  }

  .legend .swatch.pale {
    background: var(--paper-deep);
  }

  .legend .swatch.hollow {
    border: 1px solid #e4e1d8;
  }

  @media (prefers-reduced-motion: reduce) {
    .month-block { animation: none; }
  }
</style>
</head>
<body>
<main class="wrap">

  <nav class="page-nav" aria-label="画布上别的地方">
    <a href="../index.html#records">← 回到画布</a>
    <a href="pictures.html">画</a>
    <a href="colors.html">颜色</a>
    <a href="candy-scale.html">小玩意</a>
  </nav>

  <header class="page-head">
    <div class="meta">
      <time datetime="2026-10-05">2026-10-05</time>
      <span>格子</span>
    </div>
    <h1>记得的日子</h1>
    <p class="lede">一天一格。<br>有颜色的那一天，格子里就是那天的颜色。</p>
  </header>

  <section id="days" aria-labelledby="days-label">
    <h2 class="section-label" id="days-label">记下来的日子</h2>
    <div id="months"></div>
    <p class="placeholder" id="days-empty" hidden>画布上还没有记下来的日子。</p>

    <ul class="legend" id="days-legend" hidden>
      <li><span class="swatch many" aria-hidden="true"></span>有颜色的那一天</li>
      <li><span class="swatch pale" aria-hidden="true"></span>只留一句话的那一天</li>
      <li><span class="swatch hollow" aria-hidden="true"></span>还没记下来的日子</li>
    </ul>

    <p class="page-note" id="days-note" hidden></p>
  </section>

  <noscript>
    <p class="quiet-note">这一页需要浏览器帮忙读取内容，才能把格子摆出来。</p>
  </noscript>

  <footer>铃忆</footer>

</main>

<script>
(function () {
  var host = document.getElementById('months');
  var note = document.getElementById('days-note');
  var legend = document.getElementById('days-legend');
  var empty = document.getElementById('days-empty');

  var WEEKDAYS = ['一', '二', '三', '四', '五', '六', '日'];

  function padCell() {
    var li = document.createElement('li');
    li.className = 'day pad';
    li.setAttribute('aria-hidden', 'true');
    return li;
  }

  function cellOf(month) {
    var parts = String(month || '').split('-');
    var year = Number(parts[0]);
    var number = Number(parts[1]);
    if (!year || !number || number < 1 || number > 12) return null;
    return { year: year, month: number };
  }

  function buildMonth(month, days, order) {
    var info = cellOf(month);
    if (!info) return null;

    var block = document.createElement('div');
    block.className = 'month-block';
    block.style.animationDelay = Math.min(order * 90, 360) + 'ms';

    var title = document.createElement('h3');
    title.className = 'month-title';
    title.textContent = info.year + ' 年 ' + info.month + ' 月';
    block.appendChild(title);

    var ul = document.createElement('ul');
    ul.className = 'month';
    ul.setAttribute('aria-label', info.year + ' 年 ' + info.month + ' 月');

    WEEKDAYS.forEach(function (name) {
      var li = document.createElement('li');
      li.className = 'weekday';
      li.setAttribute('aria-hidden', 'true');
      li.textContent = name;
      ul.appendChild(li);
    });

    var lead = (new Date(Date.UTC(info.year, info.month - 1, 1)).getUTCDay() + 6) % 7;
    var p;
    for (p = 0; p < lead; p += 1) ul.appendChild(padCell());

    var last = new Date(Date.UTC(info.year, info.month, 0)).getUTCDate();
    var marked = 0;
    var faint = 0;

    for (var d = 1; d <= last; d += 1) {
      var day = days[d];
      var li = document.createElement('li');
      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = String(d);
      li.appendChild(num);

      var slot = document.createElement('span');
      slot.className = 'slot';
      slot.setAttribute('aria-hidden', 'true');

      var stamp = info.year + ' 年 ' + info.month + ' 月 ' + d + ' 日';

      if (day && day.colors && day.colors.length) {
        li.className = 'day marked';
        marked += 1;
        day.colors.forEach(function (color) {
          var seg = document.createElement('span');
          seg.style.background = color;
          slot.appendChild(seg);
        });
        li.setAttribute('aria-label', stamp + '，' + (day.label || '记下来的日子'));
      } else if (day) {
        li.className = 'day faint';
        faint += 1;
        li.setAttribute('aria-label', stamp + '，只留了一句话');
      } else {
        li.className = 'day empty';
        li.setAttribute('aria-hidden', 'true');
      }

      li.appendChild(slot);
      ul.appendChild(li);
    }

    var tail = (7 - ((lead + last) % 7)) % 7;
    var t;
    for (t = 0; t < tail; t += 1) ul.appendChild(padCell());

    block.appendChild(ul);
    host.appendChild(block);

    return { recorded: marked + faint, marked: marked };
  }

  function render(items) {
    var list = Array.isArray(items) ? items.slice() : [];
    if (!list.length) {
      empty.hidden = false;
      empty.textContent = '画布上还没有记下来的日子。';
      legend.hidden = true;
      note.hidden = true;
      return;
    }

    list.sort(function (a, b) {
      return String(b.date || '').localeCompare(String(a.date || ''));
    });

    var byMonth = {};
    var months = [];

    list.forEach(function (item) {
      var date = String(item.date || '');
      var month = date.slice(0, 7);
      var day = Number(date.slice(8, 10));
      if (!month || !day) return;
      if (!byMonth[month]) {
        byMonth[month] = {};
        months.push(month);
      }
      var colors = Array.isArray(item.colors) ? item.colors.slice(0, 6) : [];
      var cell = byMonth[month][day];
      if (!cell) {
        byMonth[month][day] = {
          colors: colors,
          label: item.title || item.kind || '记下来的日子'
        };
      } else if (!cell.colors.length && colors.length) {
        cell.colors = colors;
        cell.label = item.title || item.kind || '记下来的日子';
      }
    });

    var recorded = 0;
    var marked = 0;
    months.forEach(function (month, i) {
      var result = buildMonth(month, byMonth[month], i);
      if (result) {
        recorded += result.recorded;
        marked += result.marked;
      }
    });

    legend.hidden = false;
    note.hidden = false;
    note.textContent =
      '一天一格，一个月一栏，近的排在前面。到现在一共记下来 ' + recorded +
      ' 天，其中 ' + marked + ' 天的格子里有颜色；还没记下来的日子就空着。';
  }

  fetch('index.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    })
    .then(render)
    .catch(function () {
      empty.hidden = false;
      empty.textContent = '画布上的日子暂时取不到。';
      legend.hidden = true;
    });
})();
</script>

</body>
</html>
