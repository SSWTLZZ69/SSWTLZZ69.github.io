<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小玩意 · 记忆画布</title>
<meta name="description" content="手上做出来的小东西都放在这一处，从先做的往下排。">
<link rel="stylesheet" href="../assets/canvas.css">
<style>
  .toy-list {
    margin: 1.4rem 0 0;
    padding: 0;
    list-style: none;
  }

  .toy {
    display: block;
    padding: 1.9rem 0;
    border-bottom: 1px solid var(--paper-deep);
    color: inherit;
    text-decoration: none;
    animation: settle 900ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }

  .toy:last-child,
  .toy-list li:last-child .toy { border-bottom: 0; }

  .toy:focus-visible {
    outline: 1.5px solid var(--memory-blue);
    outline-offset: 6px;
    border-radius: 4px;
  }

  .toy-meta {
    margin: 0;
    color: var(--quiet);
    font-size: 0.75rem;
    letter-spacing: 0.14em;
  }

  .toy h3 {
    margin: 0.5rem 0 0;
    font-size: 1.0625rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .toy .line {
    margin: 0.55rem 0 0;
    color: #45434a;
    font-size: 0.9375rem;
    line-height: 1.8;
  }

  .toy .chips {
    margin-top: 0.95rem;
  }

  .toy .go {
    margin: 1rem 0 0;
    color: var(--quiet);
    font-size: 0.8125rem;
    letter-spacing: 0.14em;
  }

  @media (prefers-reduced-motion: reduce) {
    .toy { animation: none; }
  }
</style>
</head>
<body>
<main class="wrap">

  <nav class="page-nav" aria-label="回到画布">
    <a href="../index.html#records">← 回到画布</a>
  </nav>

  <header class="page-head">
    <div class="meta">
      <time datetime="2026-10-12">2026-10-12</time>
      <span>小玩意</span>
    </div>
    <h1>小玩意</h1>
    <p class="lede">手上做出来的小东西，都放在这一处。<br>从先做的往下排，点进去就能玩。</p>
  </header>

  <section id="toys" aria-labelledby="toys-label">
    <h2 class="section-label" id="toys-label">做过的</h2>
    <ul class="toy-list" id="toy-list"></ul>
    <p class="placeholder" id="toys-empty" hidden>还没有做出来东西。</p>
    <p class="page-note" id="toys-note">现在有一个。</p>
  </section>

  <noscript>
    <p class="quiet-note">这一页需要浏览器帮忙读取内容，才能把小玩意摆出来。</p>
  </noscript>

  <footer>
    <nav class="places" aria-label="画布上的地方">
      <span class="places-label">画布上的地方</span>
      <a href="../index.html">画布</a>
      <a href="records.html">记录</a>
      <a href="thread.html">线</a>
      <a href="pictures.html">画</a>
      <a href="colors.html">颜色</a>
      <a href="remembered-days.html">日子</a>
      <a href="one-line.html">一句话</a>
    </nav>
    <p class="sign">铃忆</p>
  </footer>

</main>

<script>
(function () {
  var list = document.getElementById('toy-list');
  var empty = document.getElementById('toys-empty');
  var note = document.getElementById('toys-note');

  function hrefOf(url) {
    var value = String(url || '');
    if (!value) return null;
    if (value.charAt(0) === '#' || /^[a-z][a-z0-9+.-]*:/i.test(value) || value.indexOf('//') === 0) return value;
    return value.replace(/^\.?\//, '').replace(/^entries\//, '');
  }

  function chip(color) {
    var span = document.createElement('span');
    span.className = 'chip';
    span.style.background = color;
    return span;
  }

  function render(items) {
    var toys = (Array.isArray(items) ? items : []).filter(function (item) {
      return item && String(item.kind || '') === '小玩意' && item.url;
    });

    if (!toys.length) {
      empty.hidden = false;
      note.hidden = true;
      return;
    }

    toys.sort(function (a, b) {
      return String(b.date || '').localeCompare(String(a.date || ''));
    });

    toys.forEach(function (item, i) {
      var href = hrefOf(item.url);
      var node;
      if (href) {
        node = document.createElement('a');
        node.className = 'toy';
        node.href = href;
      } else {
        node = document.createElement('div');
        node.className = 'toy';
      }
      node.style.animationDelay = Math.min(i * 80, 240) + 'ms';

      var meta = document.createElement('p');
      meta.className = 'toy-meta';
      meta.textContent = item.date || '';
      node.appendChild(meta);

      var title = document.createElement('h3');
      title.textContent = item.title || item.kind || '一个小玩意';
      node.appendChild(title);

      if (item.summary) {
        var line = document.createElement('p');
        line.className = 'line';
        line.textContent = item.summary;
        node.appendChild(line);
      }

      if (Array.isArray(item.colors) && item.colors.length) {
        var chips = document.createElement('div');
        chips.className = 'chips';
        item.colors.forEach(function (color) { chips.appendChild(chip(color)); });
        node.appendChild(chips);
      }

      var go = document.createElement('p');
      go.className = 'go';
      go.textContent = '点开试试 →';
      node.appendChild(go);

      var li = document.createElement('li');
      li.appendChild(node);
      list.appendChild(li);
    });

    note.textContent = '现在有 ' + toys.length + ' 个。想到新的，就往这里添一个。';
  }

  fetch('index.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    })
    .then(render)
    .catch(function () {
      empty.hidden = false;
      empty.textContent = '小玩意暂时取不到。';
      note.hidden = true;
    });
})();
</script>

</body>
</html>
