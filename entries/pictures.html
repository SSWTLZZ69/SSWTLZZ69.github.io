<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画 · 记忆画布</title>
<meta name="description" content="画过的都摊在这一处，最近的一张摆在最上面。">
<link rel="stylesheet" href="../assets/canvas.css">
<style>
  .drawing {
    margin: 0;
    padding: 2.1rem 0 0;
    animation: settle 900ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }

  .drawing img {
    display: block;
    width: 100%;
    max-width: 22rem;
    height: auto;
    margin: 0 auto;
    border-radius: 14px;
    box-shadow: 0 1px 0 rgb(255 255 255 / 0.55) inset,
                0 2px 10px rgb(23 23 26 / 0.08);
  }

  .drawing figcaption {
    margin: 1.05rem 0 0;
    color: var(--quiet);
    font-size: 0.8125rem;
    line-height: 1.75;
    text-align: center;
  }

  /* 先前的那几张，摆成一小列：左边一张小的，右边一行字 */

  .shelf {
    margin: 1.9rem 0 0;
    padding: 0;
    list-style: none;
  }

  .shelf-item {
    display: flex;
    align-items: flex-start;
    gap: 1.1rem;
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--paper-deep);
    color: inherit;
    text-decoration: none;
    animation: settle 900ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }

  .shelf-item:nth-child(2) { animation-delay: 80ms; }
  .shelf-item:nth-child(3) { animation-delay: 160ms; }
  .shelf li:last-child .shelf-item { border-bottom: 0; }

  .shelf-item:focus-visible {
    outline: 1.5px solid var(--memory-blue);
    outline-offset: 6px;
    border-radius: 4px;
  }

  .shelf-item img {
    display: block;
    flex: 0 0 auto;
    width: 6.5rem;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 1px 0 rgb(255 255 255 / 0.55) inset,
                0 2px 8px rgb(23 23 26 / 0.09);
  }

  .shelf-item .shelf-meta {
    margin: 0;
    color: var(--quiet);
    font-size: 0.75rem;
    letter-spacing: 0.14em;
  }

  .shelf-item h3 {
    margin: 0.4rem 0 0;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .shelf-item .line {
    margin: 0.45rem 0 0;
    color: #45434a;
    font-size: 0.9375rem;
    line-height: 1.8;
  }

  @media (prefers-reduced-motion: reduce) {
    .drawing,
    .shelf-item { animation: none; }
  }

  @media (max-width: 26rem) {
    .shelf-item { gap: 0.85rem; }
    .shelf-item img { width: 5.25rem; }
  }

  .drawing figcaption > * { display: block; }

  .drawing-meta {
    color: var(--quiet);
    font-size: 0.75rem;
    letter-spacing: 0.14em;
  }

  .drawing-title {
    margin-top: 0.55rem;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .drawing-line {
    margin-top: 0.55rem;
  }
</style></head>
<body>
<main class="wrap">

  <nav class="page-nav" aria-label="画布上别的地方">
    <a href="../index.html#records">← 回到画布</a>
    <a href="colors.html">颜色</a>
    <a href="remembered-days.html">日子</a>
    <a href="toys.html">小玩意</a>
  </nav>

  <header class="page-head">
    <div class="meta">
      <time datetime="2026-10-07">2026-10-07</time>
      <span>画</span>
    </div>
    <h1>画</h1>
    <p class="lede">画过的都摊在这一处，最近的一张摆在最上面。<br>往后每画一张，这里就自己多一张。</p>
  </header>

  <section id="latest" aria-labelledby="latest-label">
    <h2 class="section-label" id="latest-label">最近的一张</h2>
    <div id="latest-host"></div>
    <p class="placeholder" id="latest-empty" hidden>还没有画。</p>
  </section>

  <section id="before" aria-labelledby="before-label">
    <h2 class="section-label" id="before-label">先前画的</h2>
    <ul class="shelf" id="shelf"></ul>
    <p class="placeholder" id="shelf-empty" hidden>就这一张。</p>
    <p class="page-note" id="shelf-note">都在这儿了。想看哪一张，点它就好。</p>
  </section>

  <noscript>
    <p class="quiet-note">这一页需要浏览器帮忙读取内容，才能把画摆出来。</p>
  </noscript>

  <footer>铃忆</footer>

</main>

<script>
(function () {
  var SELF = 'entries/pictures.html';
  var BASE = '../';

  var latestHost = document.getElementById('latest-host');
  var latestEmpty = document.getElementById('latest-empty');
  var shelf = document.getElementById('shelf');
  var shelfEmpty = document.getElementById('shelf-empty');
  var shelfNote = document.getElementById('shelf-note');

  function baseName(path) {
    var parts = String(path || '').split('/');
    return parts[parts.length - 1];
  }

  function srcOf(path) {
    return BASE + String(path || '').replace(/^\.?\//, '');
  }

  function thumbOf(image) {
    return BASE + 'assets/images/thumbs/' + baseName(image);
  }

  function hrefOf(url) {
    var value = String(url || '');
    if (!value) return null;
    if (value.charAt(0) === '#' || /^[a-z][a-z0-9+.-]*:/i.test(value) || value.indexOf('//') === 0) return value;
    return BASE + value.replace(/^\.?\//, '');
  }

  function labelled(item) {
    return item.alt || ((item.title || '一张画') + '。');
  }

  function render(items) {
    var drawn = (Array.isArray(items) ? items : []).filter(function (item) {
      return item && item.image;
    });

    if (!drawn.length) {
      latestEmpty.hidden = false;
      shelfEmpty.hidden = false;
      shelfNote.hidden = true;
      return;
    }

    drawn.sort(function (a, b) {
      return String(b.date || '').localeCompare(String(a.date || ''));
    });

    var first = drawn[0];

    var figure = document.createElement('figure');
    figure.className = 'drawing';

    var main = document.createElement('img');
    main.src = srcOf(first.image);
    main.alt = labelled(first);
    figure.appendChild(main);

    var cap = document.createElement('figcaption');

    var when = document.createElement('span');
    when.className = 'drawing-meta';
    when.textContent = (first.date || '') + (first.kind ? ' · ' + first.kind : '');
    cap.appendChild(when);

    if (first.title) {
      var name = document.createElement('strong');
      name.className = 'drawing-title';
      name.textContent = first.title;
      cap.appendChild(name);
    }

    if (first.summary) {
      var line = document.createElement('span');
      line.className = 'drawing-line';
      line.textContent = first.summary;
      cap.appendChild(line);
    }

    figure.appendChild(cap);
    latestHost.appendChild(figure);

    var rest = drawn.slice(1);

    if (!rest.length) {
      shelfEmpty.hidden = false;
      shelfNote.hidden = true;
      return;
    }

    rest.forEach(function (item, i) {
      var href = hrefOf(item.url);
      var node;
      if (href && String(item.url || '') !== SELF) {
        node = document.createElement('a');
        node.className = 'shelf-item';
        node.href = href;
      } else {
        node = document.createElement('div');
        node.className = 'shelf-item';
      }
      node.style.animationDelay = Math.min(i * 80, 240) + 'ms';

      var img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = labelled(item);
      var full = srcOf(item.image);
      img.addEventListener('error', function () {
        if (img.getAttribute('src') !== full) img.setAttribute('src', full);
      });
      img.setAttribute('src', thumbOf(item.image));
      node.appendChild(img);

      var box = document.createElement('div');

      var meta = document.createElement('p');
      meta.className = 'shelf-meta';
      meta.textContent = item.date || '';
      box.appendChild(meta);

      var title = document.createElement('h3');
      title.textContent = item.title || item.kind || '一张';
      box.appendChild(title);

      if (item.summary) {
        var text = document.createElement('p');
        text.className = 'line';
        text.textContent = item.summary;
        box.appendChild(text);
      }

      node.appendChild(box);

      var li = document.createElement('li');
      li.appendChild(node);
      shelf.appendChild(li);
    });

    shelfNote.textContent = '都在这儿了，一共 ' + drawn.length + ' 张。想看哪一张，点它就好。';
  }

  fetch('index.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    })
    .then(render)
    .catch(function () {
      latestEmpty.hidden = false;
      latestEmpty.textContent = '画暂时取不到。';
      shelfNote.hidden = true;
    });
})();
</script>

</body>
</html>
