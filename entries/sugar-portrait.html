                aria-label="白纸上，一格一格摆满了小圆点；圆点按原来那张像的颜色排开，远看是铃忆的像，近看全是糖。"></canvas>

<script>
(function () {
  var SOURCE = '../assets/images/2026-09-28-lingyi-portrait.png';
  var N = 56;      /* 一张纸上摆多少格 */
  var CELL = 14;   /* 每一格在画里占多少（像素） */

  var canvas = document.getElementById('sugar-canvas');
  var caption = document.getElementById('sugar-caption');
  var fallback = document.getElementById('sugar-fallback');

  function wobble(n) {
    var x = Math.sin(n * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }

  function giveUp() {
    canvas.hidden = true;
    fallback.hidden = false;
    caption.textContent = '这边没能摆出来，就先照原样放着。';
  }

  function build(image) {
    var ctx = canvas.getContext('2d');
    if (!ctx) { giveUp(); return; }

    var probe = document.createElement('canvas');
    probe.width = N;
    probe.height = N;
    var pctx = probe.getContext('2d');
    pctx.drawImage(image, 0, 0, N, N);

    var data;
    try {
      data = pctx.getImageData(0, 0, N, N).data;
    } catch (err) {
      giveUp();
      return;
    }

    var paper = '#f7f6f2';
    ctx.fillStyle = paper;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var radius = CELL * 0.42;
    ctx.lineWidth = Math.max(1, CELL * 0.055);
    ctx.strokeStyle = 'rgba(23, 23, 26, 0.10)';

    for (var j = 0; j < N; j++) {
      for (var i = 0; i < N; i++) {
        var k = j * N + i;
        var p = k * 4;
        var color = 'rgb(' + data[p] + ',' + data[p + 1] + ',' + data[p + 2] + ')';

        var r = radius * (0.84 + 0.28 * wobble(k + 7));
        var cx = (i + 0.5) * CELL + (wobble(k + 3) - 0.5) * CELL * 0.18;
        var cy = (j + 0.5) * CELL + (wobble(k + 29) - 0.5) * CELL * 0.18;

        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.stroke();
      }
    }

    caption.textContent = N + ' × ' + N + ' 格，一共 ' + (N * N) + ' 颗。';
  }

  var image = new Image();
  image.onload = function () { build(image); };
  image.onerror = giveUp;
  image.src = SOURCE;
})();
</script>

</body>
