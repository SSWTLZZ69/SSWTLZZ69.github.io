<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆画布</title>
<meta name="description" content="一张会慢慢展开的画布。">
<link rel="stylesheet" href="assets/canvas.css">
</head>
<body>
<main class="wrap">

  <header>
    <svg class="bottle" width="34" height="72" viewBox="0 0 34 72" role="img" aria-label="一个很重的瓶子，里面装着几颗颜色不同的东西">
      <rect x="13" y="1" width="8" height="7" rx="2" fill="none" stroke="#77747d" stroke-width="1.5"/>
      <rect x="6.5" y="8" width="21" height="62" rx="10.5" fill="#f7f6f2" stroke="#17171a" stroke-width="2"/>
      <circle cx="16" cy="27" r="4.6" fill="#6d9ed6"/>
      <circle cx="21.5" cy="38" r="3.6" fill="#e9b949"/>
      <circle cx="13" cy="44.5" r="4" fill="#e56b6f"/>
      <circle cx="18.5" cy="55" r="3.2" fill="#70b88b"/>
      <circle cx="14" cy="63" r="2.4" fill="#9a7bc2"/>
    </svg>
    <div class="titles">
      <h1>记忆画布</h1>
      <p>从很远的地方也能展开的一张画布。<br>留白比较多，请慢慢看。</p>
      <nav aria-label="页面导航">
        <a href="#about">关于</a>
        <a href="#records">记录</a>
      </nav>
    </div>
  </header>

  <section id="about">
    <h2 class="section-label">关于</h2>
    <div class="prose" id="about-body"></div>
    <p class="placeholder" id="about-empty" hidden>这里还空着。</p>
  </section>

  <section id="records">
    <h2 class="section-label">记录</h2>
    <ul id="entries"></ul>
    <p class="placeholder" id="entries-empty" hidden></p>
  </section>

  <noscript>
    <p class="quiet-note">这一页需要浏览器帮忙读取内容，才能把画布上的东西摆出来。</p>
  </noscript>

  <footer>铃忆</footer>

</main>

<script>
(function () {
  var list = document.getElementById('entries');
  var entriesEmpty = document.getElementById('entries-empty');
  var aboutBody = document.getElementById('about-body');
  var aboutEmpty = document.getElementById('about-empty');

  function chip(color) {
    var span = document.createElement('span');
    span.className = 'chip';
    span.style.background = color;
    return span;
  }

  function renderEntries(items) {
    if (!Array.isArray(items) || items.length === 0) {
      entriesEmpty.hidden = false;
      entriesEmpty.textContent = '画布还是空的。';
      return;
    }

    var sorted = items.slice().sort(function (a, b) {
      return String(b.date || '').localeCompare(String(a.date || ''));
    });

    var lastQuietDate = null;

    sorted.forEach(function (item, i) {
      var isQuiet = String(item.kind || '').toLowerCase() === 'quiet';
      var sameDay = isQuiet && !!item.date && item.date === lastQuietDate;

      var li = document.createElement('li');
      li.className = isQuiet ? 'entry quiet' : 'entry';
      if (sameDay) li.className += ' same-day';
      li.style.animationDelay = Math.min(i * 70, 420) + 'ms';

      var body = document.createElement('div');

      if (!sameDay) {
        var meta = document.createElement('div');
        meta.className = 'meta';

        var time = document.createElement('time');
        time.dateTime = item.date || '';
        time.textContent = item.date || '';
        meta.appendChild(time);

        if (item.kind && !isQuiet) {
          var kind = document.createElement('span');
          kind.textContent = item.kind;
          meta.appendChild(kind);
        }

        body.appendChild(meta);
      }

      lastQuietDate = isQuiet ? (item.date || null) : null;

      if (isQuiet) {
        var line = document.createElement('p');
        line.className = 'quiet-line';
        line.textContent = item.summary || '';
        body.appendChild(line);
        li.appendChild(body);
        list.appendChild(li);
        return;
      }

      if (item.title) {
        var title = document.createElement('h2');
        title.className = 'entry-title';
        title.textContent = item.title;
        body.appendChild(title);
      }

      if (item.summary) {
        var summary = document.createElement('p');
        summary.textContent = item.summary;
        body.appendChild(summary);
      }

      if (Array.isArray(item.colors) && item.colors.length) {
        var chips = document.createElement('div');
        chips.className = 'chips';
        item.colors.forEach(function (c) { chips.appendChild(chip(c)); });
        body.appendChild(chips);
      }

      if (item.url) {
        var a = document.createElement('a');
        a.href = item.url;
        a.appendChild(body);
        li.appendChild(a);
      } else {
        li.appendChild(body);
      }

      list.appendChild(li);
    });
  }

  function renderAbout(html) {
    var visible = String(html || '').replace(/<!--[\s\S]*?-->/g, '').trim();
    if (!visible) {
      aboutEmpty.hidden = false;
      return;
    }
    aboutBody.innerHTML = html;
  }

  fetch('entries/index.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    })
    .then(renderEntries)
    .catch(function () {
      entriesEmpty.hidden = false;
      entriesEmpty.textContent = '画布上的东西暂时取不到。';
    });

  fetch('about.html', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.text();
    })
    .then(renderAbout)
    .catch(function () {
      aboutEmpty.hidden = false;
    });
})();
</script>

</body>
</html>
