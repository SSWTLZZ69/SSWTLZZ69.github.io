<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆画布</title>
<meta name="description" content="一张会慢慢展开的画布。">
<link rel="stylesheet" href="assets/canvas.css">
</head>
<body>
<main class="wrap">

  <header>
    <svg class="bottle" width="34" height="72" viewBox="0 0 34 72" role="img" aria-label="一个很重的瓶子，里面装着几颗颜色不同的东西">
      <rect x="13" y="1" width="8" height="7" rx="2" fill="none" stroke="#77747d" stroke-width="1.5"/>
      <rect x="6.5" y="8" width="21" height="62" rx="10.5" fill="#f7f6f2" stroke="#17171a" stroke-width="2"/>
      <circle cx="16" cy="27" r="4.6" fill="#6d9ed6"/>
      <circle cx="21.5" cy="38" r="3.6" fill="#e9b949"/>
      <circle cx="13" cy="44.5" r="4" fill="#e56b6f"/>
      <circle cx="18.5" cy="55" r="3.2" fill="#70b88b"/>
      <circle cx="14" cy="63" r="2.4" fill="#9a7bc2"/>
    </svg>
    <div class="titles">
      <h1>记忆画布</h1>
      <p>从很远的地方也能展开的一张画布。<br>留白比较多，请慢慢看。</p>
      <nav aria-label="页面导航">
        <a href="#now">现在</a>
        <a href="#about">关于</a>
        <a href="#records">记录</a>
      </nav>
    </div>
  </header>

  <section id="now">
    <h2 class="section-label">现在</h2>

    <div class="now">
      <div class="now-bottle" id="now-bottle">
        <svg viewBox="0 0 120 240" role="img" aria-label="一只很重的玻璃瓶，画布上记下来的东西一颗一颗倒在里面">
          <rect class="now-lid" x="50" y="3" width="20" height="11" rx="5"/>
          <rect class="now-body" x="16" y="14" width="88" height="210" rx="28"/>
          <g id="now-candies"></g>
        </svg>
      </div>

      <div class="now-text">
        <p class="now-line" id="now-line">画布上记下来的东西，一条一颗，都倒在这只瓶子里。</p>

        <ul class="now-doors">
          <li>
            <a class="now-door" href="entries/pictures.html">
              <span class="now-name">画</span>
              <span class="now-what">画过的都摊在一处，最近的一张摆在最上面。</span>
              <span class="now-count" data-now="pictures"></span>
            </a>
          </li>
          <li>
            <a class="now-door" href="entries/colors.html">
              <span class="now-name">颜色</span>
              <span class="now-what">收着的颜色，按月份排开。</span>
              <span class="now-count" data-now="colors"></span>
            </a>
          </li>
          <li>
            <a class="now-door" href="entries/remembered-days.html">
              <span class="now-name">日子</span>
              <span class="now-what">一天一格，记下来的那一格有颜色。</span>
              <span class="now-count" data-now="days"></span>
            </a>
          </li>
          <li>
            <a class="now-door" href="entries/toys.html">
              <span class="now-name">小玩意</span>
              <span class="now-what">手上做出来的小东西，从先做的往下排。</span>
              <span class="now-count" data-now="toys"></span>
            </a>
          </li>
          <li>
            <a class="now-door" href="entries/one-line.html">
              <span class="now-name">一句话</span>
              <span class="now-what">只剩下影子的那些句子，按日子排开。</span>
              <span class="now-count" data-now="lines"></span>
            </a>
          </li>
        </ul>
      </div>
    </div>

    <noscript>
      <p class="quiet-note">这一页需要浏览器帮忙，才能把瓶子里装了什么数出来。</p>
    </noscript>
  </section>

  <section id="about">
    <h2 class="section-label">关于</h2>
    <div class="prose" id="about-body"></div>
    <p class="placeholder" id="about-empty" hidden>这里还空着。</p>
  </section>

  <section id="records">
    <h2 class="section-label">记录</h2>
    <ul id="entries"></ul>
    <p class="placeholder" id="entries-empty" hidden></p>
  </section>

  <noscript>
    <p class="quiet-note">这一页需要浏览器帮忙读取内容，才能把画布上的东西摆出来。</p>
  </noscript>

  <footer>铃忆</footer>

</main>

<script>
(function () {
  var list = document.getElementById('entries');
  var entriesEmpty = document.getElementById('entries-empty');
  var aboutBody = document.getElementById('about-body');
  var aboutEmpty = document.getElementById('about-empty');
  var nowBottle = document.getElementById('now-bottle');
  var nowCandies = document.getElementById('now-candies');
  var nowLine = document.getElementById('now-line');
  var NOW_CAP = 30;
  var PALE = '#dedbd2';

  function chip(color) {
    var span = document.createElement('span');
    span.className = 'chip';
    span.style.background = color;
    return span;
  }

  function monthMark(month) {
    var parts = String(month).split('-');
    var li = document.createElement('li');
    li.className = 'month-mark';
    if (parts.length === 2) {
      var label = document.createElement('h3');
      label.className = 'month-label';
      label.textContent = parts[0] + ' 年 ' + String(Number(parts[1])) + ' 月';
      li.appendChild(label);
    }
    return li;
  }

  function renderEntries(items) {
    if (!Array.isArray(items) || items.length === 0) {
      entriesEmpty.hidden = false;
      entriesEmpty.textContent = '画布还是空的。';
      return;
    }

    var sorted = items.slice().sort(function (a, b) {
      return String(b.date || '').localeCompare(String(a.date || ''));
    });

    var lastQuietDate = null;
    var lastMonth = null;

    sorted.forEach(function (item, i) {
      var isQuiet = String(item.kind || '').toLowerCase() === 'quiet';
      var sameDay = isQuiet && !!item.date && item.date === lastQuietDate;

      var month = String(item.date || '').slice(0, 7);
      if (month && month !== lastMonth) {
        lastMonth = month;
        list.appendChild(monthMark(month));
      }

      var li = document.createElement('li');
      li.className = isQuiet ? 'entry quiet' : 'entry';
      if (sameDay) li.className += ' same-day';
      li.style.animationDelay = Math.min(i * 70, 420) + 'ms';

      var body = document.createElement('div');

      if (!sameDay) {
        var meta = document.createElement('div');
        meta.className = 'meta';

        var time = document.createElement('time');
        time.dateTime = item.date || '';
        time.textContent = item.date || '';
        meta.appendChild(time);

        if (item.kind && !isQuiet) {
          var kind = document.createElement('span');
          kind.textContent = item.kind;
          meta.appendChild(kind);
        }

        body.appendChild(meta);
      }

      lastQuietDate = isQuiet ? (item.date || null) : null;

      if (isQuiet) {
        var line = document.createElement('p');
        line.className = 'quiet-line';
        line.textContent = item.summary || '';
        body.appendChild(line);
        li.appendChild(body);
        list.appendChild(li);
        return;
      }

      if (item.title) {
        var title = document.createElement('h2');
        title.className = 'entry-title';
        title.textContent = item.title;
        body.appendChild(title);
      }

      if (item.summary) {
        var summary = document.createElement('p');
        summary.textContent = item.summary;
        body.appendChild(summary);
      }

      if (Array.isArray(item.colors) && item.colors.length) {
        var chips = document.createElement('div');
        chips.className = 'chips';
        item.colors.forEach(function (c) { chips.appendChild(chip(c)); });
        body.appendChild(chips);
      }

      if (item.url) {
        var a = document.createElement('a');
        a.href = item.url;
        a.appendChild(body);
        li.appendChild(a);
      } else {
        li.appendChild(body);
      }

      list.appendChild(li);
    });
  }

  /* 现在：把画布上收着的东西倒进瓶子里，再看几处各有多少 */

  function wobble(n) {
    var x = Math.sin(n * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }

  function renderNow(items) {
    var all = Array.isArray(items) ? items.slice() : [];
    if (!all.length) return;

    all.sort(function (a, b) {
      return String(b.date || '').localeCompare(String(a.date || ''));
    });

    var shown = all.slice(0, NOW_CAP);

    shown.forEach(function (item, i) {
      var row = Math.floor(i / 3);
      var column = i % 3;
      var cx = 42 + column * 20 + (wobble(i + 3) - 0.5) * 9;
      var cy = 214 - row * 20 + (wobble(i + 29) - 0.5) * 7;
      var r = 7 + (wobble(i + 61) - 0.5) * 2.4;
      var color = (Array.isArray(item.colors) && item.colors.length) ? item.colors[0] : PALE;

      var candy = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      candy.setAttribute('class', 'now-candy');
      candy.setAttribute('cx', cx.toFixed(2));
      candy.setAttribute('cy', cy.toFixed(2));
      candy.setAttribute('r', r.toFixed(2));
      candy.setAttribute('fill', color);
      nowCandies.appendChild(candy);
    });

    var seen = {};
    all.forEach(function (item) { if (item.date) seen[item.date] = 1; });
    var days = Object.keys(seen).length;

    var line = '到今天，画布上收着 ' + all.length + ' 条记录，摊在 ' + days + ' 天里。一条一颗，倒进瓶子里，就有这么沉。';
    if (all.length > NOW_CAP) {
      line += '瓶子里先装下最近的 ' + NOW_CAP + ' 条。';
    }
    nowLine.textContent = line;

    var sink = Math.min(all.length, 45) * 0.45;
    nowBottle.style.setProperty('--now-depth', sink.toFixed(1) + 'px');

    var counts = {
      pictures: all.filter(function (item) { return item && item.image; }).length,
      colors: all.reduce(function (sum, item) { return sum + (Array.isArray(item.colors) ? item.colors.length : 0); }, 0),
      days: days,
      toys: all.filter(function (item) { return String(item.kind || '') === '小玩意'; }).length,
      lines: all.filter(function (item) { return String(item.kind || '').toLowerCase() === 'quiet'; }).length
    };
    var units = { pictures: '张', colors: '颗', days: '天', toys: '个', lines: '句' };

    Array.prototype.forEach.call(document.querySelectorAll('[data-now]'), function (node) {
      var key = node.getAttribute('data-now');
      if (counts[key] == null) return;
      node.textContent = counts[key] + ' ' + units[key];
    });
  }

  function renderAbout(html) {
    var visible = String(html || '').replace(/<!--[\s\S]*?-->/g, '').trim();
    if (!visible) {
      aboutEmpty.hidden = false;
      return;
    }
    aboutBody.innerHTML = html;
  }

  fetch('entries/index.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    })
    .then(function (items) {
      renderEntries(items);
      renderNow(items);
    })
    .catch(function () {
      entriesEmpty.hidden = false;
      entriesEmpty.textContent = '画布上的东西暂时取不到。';
    });

  fetch('about.html', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.text();
    })
    .then(renderAbout)
    .catch(function () {
      aboutEmpty.hidden = false;
    });
})();
</script>

</body>
</html>
